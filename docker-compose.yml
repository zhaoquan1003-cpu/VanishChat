# =============================================================================
# VanishChat 一键部署：Redis（纯内存）+ 应用 + Nginx 接入层
#   启动：docker compose up -d --build
#   访问：http://localhost
# =============================================================================
services:
  redis:
    image: redis:7-alpine
    container_name: vanishchat-redis
    # 关闭 RDB / AOF —— 数据只存在于内存，重启即清空，符合"不留痕"的产品约束
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [vanishchat]

  app:
    build: .
    container_name: vanishchat-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      STORE_DRIVER: redis
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SESSION_DEFAULT_TTL_HOURS: ${SESSION_DEFAULT_TTL_HOURS:-24}
      SESSION_EXPIRY_TIERS: ${SESSION_EXPIRY_TIERS:-1,2,6,12,24,72}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
    # 上传文件放 tmpfs：物理层也只有内存，容器重启即消失
    tmpfs:
      - /app/storage:size=256m,mode=1777
    # 需要多实例水平扩容时，把上面的 ports 换成 deploy.replicas，再由 Nginx 负载均衡
    expose:
      - "3000"
    networks: [vanishchat]

  nginx:
    image: nginx:1.27-alpine
    container_name: vanishchat-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [vanishchat]

networks:
  vanishchat:
    driver: bridge
