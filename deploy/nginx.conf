# =============================================================================
# VanishChat 接入层
# 职责：反向代理、WebSocket 协议升级、静态资源压缩透传、基础安全头
# 部署到真实域名时，请补充 TLS 配置（listen 443 ssl）并把 80 端口 301 过去
# =============================================================================

upstream vanishchat_app {
    # 多实例扩容时在这里追加：server app2:3000;  server app3:3000;
    server app:3000;
    keepalive 32;
}

# WebSocket 场景必须使用 ip_hash / 或让 socket.io 走 Redis 适配器广播；
# 本项目已内置 Redis 适配器，因此无需粘性会话，可放心用轮询负载均衡。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 上传体积需与服务端 MAX_FILE_SIZE_MB 对齐
    client_max_body_size 32m;
    client_body_timeout 120s;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 会话数据不缓存：任何中间层缓存都是数据残留风险
    add_header Cache-Control "no-store" always;

    location /socket.io/ {
        proxy_pass http://vanishchat_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接不设短超时，否则会被误断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://vanishchat_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 前端 SPA 与静态资源由 Node 服务托管，Nginx 只做转发
    location / {
        proxy_pass http://vanishchat_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
